<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Maestro - حديقة الوحوش العازفة</title>
    <!-- مكتبات MediaPipe للبراوزر -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        h2 { margin: 8px; font-size: 18px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.7); }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #000;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* مرآة */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            max-width: 400px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-party { background-color: #ff007f; color: white; }
        .btn-reset { background-color: #3f3f46; color: white; }
        .status-bar {
            margin-top: 8px;
            font-size: 14px;
            color: #ff007f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>👾 حديقة الوحوش العازفة - Air Maestro</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-bar" id="statusBar">حرك يدك لتوقظ الوحش وتجعله يعزف!</div>

    <div class="controls">
        <button class="btn-party" onclick="switchMonster()">تغيير نوع الوحش 🎭</button>
        <button class="btn-reset" onclick="resetCanvas()">مسح الشاشة</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        let particles = [];
        let monsterType = 0; // تغيير شكل الوحش
        let mouthOpen = false;
        let isMoving = false;
        let lastMoveTime = Date.now();

        // نظام إصدار أصوات موسيقية عبر Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playNote(freq) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = monsterType === 0 ? 'sawtooth' : (monsterType === 1 ? 'triangle' : 'square');
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function switchMonster() {
            monsterType = (monsterType + 1) % 3;
            const names = ["الوحش الفضائي (بلوب)", "الوحش الدبوس (زوزو)", "الوحش الروبوت (بيبو)"];
            statusBar.innerText = `تم استدعاء: ${names[monsterType]}!`;
        }

        function resetCanvas() {
            particles = [];
        }

        function drawMonster(x, y, isPlaying) {
            canvasCtx.save();
            canvasCtx.translate(x, y);

            // حجم الوحش ولونه بناءً على نوعه
            let baseColor = monsterType === 0 ? '#ff007f' : (monsterType === 1 ? '#00ffcc' : '#ffee00');
            let eyeColor = '#ffffff';

            // جسم الوحش (دائري أو بيضاوي مرن)
            canvasCtx.beginPath();
            let radius = 45 + (isPlaying ? Math.sin(Date.now() / 50) * 5 : 0);
            canvasCtx.arc(0, 0, radius, 0, Math.PI * 2);
            canvasCtx.fillStyle = baseColor;
            canvasCtx.shadowBlur = 25;
            canvasCtx.shadowColor = baseColor;
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;

            // العيون المتحركة
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 8, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 8, 0, Math.PI * 2);
            canvasCtx.fillStyle = eyeColor;
            canvasCtx.fill();

            // بؤبؤ العين
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 3, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 3, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fill();

            // الفم (يفتح ويغلق عند العزف)
            canvasCtx.beginPath();
            if (isPlaying) {
                canvasCtx.arc(0, 15, 12, 0, Math.PI * 2); // فم مفتوح يصدر أصواتاً
                canvasCtx.fillStyle = '#000';
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#fff';
                canvasCtx.stroke();
            } else {
                canvasCtx.arc(0, 15, 10, 0, Math.PI); // فم نائم / مغلق
                canvasCtx.strokeStyle = '#000';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            }

            canvasCtx.restore();
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let handActive = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8]; // السبابة
                const x = indexFinger.x * canvasElement.width;
                const y = indexFinger.y * canvasElement.height;

                handActive = true;
                lastMoveTime = Date.now();

                // حساب التردد الصوتي بناءً على الارتفاع
                let freq = 150 + (canvasElement.height - y) * 2.5;

                // توليد أشكال طاقة نيون تخرج من الوحش/الإصبع
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 10 + 3,
                    color: monsterType === 0 ? '#ff007f' : (monsterType === 1 ? '#00ffcc' : '#ffee00'),
                    alpha: 1,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8
                });

                if (Math.random() < 0.35) {
                    playNote(freq);
                }

                // رسم الوحش يتبع الإصبع بمسافة بسيطة أو فوقه مباشرة
                drawMonster(x, y - 50, true);
            } else {
                // إذا لم تكن اليد موجودة، يظهر الوحش نائماً في منتصف الشاشة
                if (Date.now() - lastMoveTime > 2000) {
                    drawMonster(canvasElement.width / 2, canvasElement.height / 2, false);
                }
            }

            // تحديث ورسم الجزيئات
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    canvasCtx.save();
                    canvasCtx.globalAlpha = p.alpha;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.fill();
                    canvasCtx.restore();
                }
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            alert("خطأ في تشغيل الكاميرا: " + err);
        });
    </script>
</body>
</html>
