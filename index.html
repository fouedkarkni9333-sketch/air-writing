<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Maestro - حديقة الوحوش العازفة</title>
    <!-- مكتبات MediaPipe للبراوزر -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        h2 { margin: 8px; font-size: 18px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.7); }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #000;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* مرآة */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            max-width: 400px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-party { background-color: #ff007f; color: white; }
        .btn-reset { background-color: #3f3f46; color: white; }
        .status-bar {
            margin-top: 8px;
            font-size: 14px;
            color: #ff007f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>👾 حديقة الوحوش العازفة - Air Maestro</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-bar" id="statusBar">حرك يدك لتوقظ الوحش وتجعله يعزف وتجنب القنابل!</div>

    <div class="controls">
        <button class="btn-party" onclick="switchMonster()">تغيير نوع الوحش 🎭</button>
        <button class="btn-reset" onclick="resetCanvas()">مسح الشاشة</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        let particles = [];
        let items = []; // مصفوفة النوتات والقنابل الساقطة
        let score = 0;
        let combo = 0;
        let lives = 3;
        let isGameOver = false;
        let monsterType = 0; // تغيير شكل الوحش
        let mouthOpen = false;
        let isMoving = false;
        let lastMoveTime = Date.now();

        // نظام إصدار أصوات موسيقية عبر Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playNote(freq, typeOverride, duration = 0.25, vol = 0.08) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = typeOverride || (monsterType === 0 ? 'sawtooth' : (monsterType === 1 ? 'triangle' : 'square'));
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function switchMonster() {
            monsterType = (monsterType + 1) % 3;
            const names = ["الوحش الفضائي (بلوب)", "الوحش الدبوس (زوزو)", "الوحش الروبوت (بيبو)"];
            statusBar.innerText = `تم استدعاء: ${names[monsterType]}!`;
        }

        function resetCanvas() {
            particles = [];
            items = [];
            score = 0;
            combo = 0;
            lives = 3;
            isGameOver = false;
            statusBar.innerText = "لعبة جديدة! حرك يدك لالتقاط النوتات.";
        }

        // توليد عناصر هابطة (نوتات أو قنابل)
        setInterval(() => {
            if (canvasElement.width > 0 && !isGameOver) {
                let isBomb = Math.random() < 0.25; // نسبة ظهور القنابل 25%
                items.push({
                    x: Math.random() * (canvasElement.width - 60) + 30,
                    y: -30,
                    speed: 2 + Math.random() * 2.5,
                    radius: isBomb ? 20 : 16,
                    isBomb: isBomb,
                    color: isBomb ? '#111' : ['#ff007f', '#00ffcc', '#ffee00', '#ff5500'][Math.floor(Math.random() * 4)]
                });
            }
        }, 1300);

        function drawMonster(x, y, isPlaying) {
            canvasCtx.save();
            canvasCtx.translate(x, y);

            // حجم الوحش ولونه بناءً على نوعه (مع دعم Fever Mode)
            let baseColor = monsterType === 0 ? '#ff007f' : (monsterType === 1 ? '#00ffcc' : '#ffee00');
            if (combo >= 10) {
                baseColor = `hsl(${Date.now() / 5 % 360}, 100%, 50%)`;
            }
            let eyeColor = '#ffffff';

            // جسم الوحش (دائري أو بيضاوي مرن)
            canvasCtx.beginPath();
            let radius = 45 + (isPlaying ? Math.sin(Date.now() / 50) * 5 : 0);
            canvasCtx.arc(0, 0, radius, 0, Math.PI * 2);
            canvasCtx.fillStyle = baseColor;
            canvasCtx.shadowBlur = combo >= 10 ? 35 : 25;
            canvasCtx.shadowColor = baseColor;
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;

            // العيون المتحركة
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 8, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 8, 0, Math.PI * 2);
            canvasCtx.fillStyle = eyeColor;
            canvasCtx.fill();

            // بؤبؤ العين
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 3, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 3, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fill();

            // الفم (يفتح ويغلق عند العزف)
            canvasCtx.beginPath();
            if (isPlaying) {
                canvasCtx.arc(0, 15, 12, 0, Math.PI * 2); // فم مفتوح يصدر أصواتاً
                canvasCtx.fillStyle = '#000';
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#fff';
                canvasCtx.stroke();
            } else {
                canvasCtx.arc(0, 15, 10, 0, Math.PI); // فم نائم / مغلق
                canvasCtx.strokeStyle = '#000';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            }

            canvasCtx.restore();
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // تفعيل لون خلفية Fever Mode
            if (combo >= 10) {
                canvasCtx.fillStyle = `hsla(${Date.now() / 4 % 360}, 100%, 50%, 0.1)`;
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            }

            // شاشة انتهاء اللعبة
            if (isGameOver) {
                canvasCtx.fillStyle = "rgba(0, 0, 0, 0.85)";
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.fillStyle = "#ff007f";
                canvasCtx.font = "bold 30px Arial";
                canvasCtx.textAlign = "center";
                canvasCtx.fillText("انتهت اللعبة! 💀", canvasElement.width / 2, canvasElement.height / 2 - 20);
                canvasCtx.fillStyle = "#ffffff";
                canvasCtx.font = "bold 18px Arial";
                canvasCtx.fillText(`النتيجة النهائية: ${score}`, canvasElement.width / 2, canvasElement.height / 2 + 20);
                canvasCtx.restore();
                return;
            }

            let monsterX = canvasElement.width / 2;
            let monsterY = canvasElement.height / 2;
            let handActive = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8]; // السبابة
                // ضبط انعكاس المرآة ليتطابق مع مكان الإصبع بدقة
                monsterX = (1 - indexFinger.x) * canvasElement.width;
                monsterY = indexFinger.y * canvasElement.height;

                handActive = true;
                lastMoveTime = Date.now();
            }

            // --- تحديث ورسم العناصر الهابطة (نوتات + قنابل) ---
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);

                if (item.isBomb) {
                    canvasCtx.fillStyle = "#111";
                    canvasCtx.shadowBlur = 10;
                    canvasCtx.shadowColor = "#ff0000";
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = "#ff3333";
                    canvasCtx.stroke();
                    canvasCtx.fillStyle = "#ff0000";
                    canvasCtx.font = "bold 12px Arial";
                    canvasCtx.fillText("💣", item.x - 8, item.y + 4);
                } else {
                    canvasCtx.fillStyle = item.color;
                    canvasCtx.shadowBlur = combo >= 10 ? 25 : 15;
                    canvasCtx.shadowColor = item.color;
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#fff';
                    canvasCtx.stroke();
                }
                canvasCtx.restore();

                // فحص الاصطدام مع الوحش (الإصبع)
                let dist = Math.hypot(monsterX - item.x, (monsterY - 50) - item.y);
                if (dist < 45) {
                    if (item.isBomb) {
                        // اصطدام بقنبلة!
                        lives--;
                        combo = 0;
                        playNote(75, 'sawtooth', 0.3, 0.15); // صوت نشاز حاد
                        statusBar.innerText = "احذر! لقد لمست قنبلة!";
                        if (lives <= 0) {
                            isGameOver = true;
                        }
                    } else {
                        // التقاط نوتة موسيقية
                        let multiplier = combo >= 10 ? 2 : 1;
                        score += (10 + (combo * 2)) * multiplier;
                        combo++;

                        let freq = 150 + (canvasElement.height - item.y) * 2.5;
                        playNote(freq);

                        // توليد جزيئات طاقة نيون
                        for (let p = 0; p < 6; p++) {
                            particles.push({
                                x: item.x,
                                y: item.y,
                                radius: Math.random() * 8 + 3,
                                color: item.color,
                                alpha: 1,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8
                            });
                        }
                    }
                    items.splice(i, 1);
                } else if (item.y > canvasElement.height + 20) {
                    if (!item.isBomb && combo > 0) combo = 0;
                    items.splice(i, 1);
                }
            }

            // رسم الوحش يتبع الإصبع أو يظهر في المنتصف
            if (handActive) {
                drawMonster(monsterX, monsterY - 50, true);
            } else {
                if (Date.now() - lastMoveTime > 2000) {
                    drawMonster(canvasElement.width / 2, canvasElement.height / 2, false);
                } else {
                    drawMonster(monsterX, monsterY - 50, true);
                }
            }

            // تحديث ورسم الجزيئات
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    canvasCtx.save();
                    canvasCtx.globalAlpha = p.alpha;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.fill();
                    canvasCtx.restore();
                }
            }

            // رسم النقاط، الكومبو، والأرواح على الشاشة
            canvasCtx.save();
            canvasCtx.font = "bold 18px Arial";
            canvasCtx.shadowBlur = 6;
            canvasCtx.shadowColor = "#000";
            
            canvasCtx.fillStyle = "#00ffcc";
            canvasCtx.fillText(`النقاط: ${score}`, 25, 30);
            
            if (combo >= 10) {
                canvasCtx.fillStyle = "#ffee00";
                canvasCtx.fillText(`🔥 FEVER MODE x${combo} 🔥`, 25, 60);
            } else {
                canvasCtx.fillStyle = "#ff007f";
                canvasCtx.fillText(`الكومبو: x${combo}`, 25, 60);
            }

            let heartsText = "❤️ ".repeat(lives);
            canvasCtx.fillStyle = "#ff3333";
            canvasCtx.fillText(`الأرواح: ${heartsText}`, 25, 90);

            canvasCtx.restore();

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            alert("خطأ في تشغيل الكاميرا: " + err);
        });
    </script>
</body>
</html>
