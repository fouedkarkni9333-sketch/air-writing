<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Maestro - حديقة الوحوش العازفة</title>
    <!-- مكتبات MediaPipe للبراوزر -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        h2 { margin: 8px; font-size: 18px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.7); }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #000;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* مرآة */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            max-width: 400px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-party { background-color: #ff007f; color: white; }
        .btn-reset { background-color: #3f3f46; color: white; }
        .status-bar {
            margin-top: 8px;
            font-size: 14px;
            color: #ff007f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>👾 حديقة الوحوش العازفة - وضع اللعبة</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-bar" id="statusBar">التقط النوتات الهابطة بإصبعك!</div>

    <div class="controls">
        <button class="btn-party" onclick="switchMonster()">تغيير نوع الوحش 🎭</button>
        <button class="btn-reset" onclick="resetGame()">إعادة اللعبة</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        let particles = [];
        let notes = []; // مصفوفة النوتات الموسيقية الهابطة
        let score = 0;
        let combo = 0;
        let monsterType = 0; 
        let lastMoveTime = Date.now();

        // نظام إصدار أصوات موسيقية عبر Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playNote(freq) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = monsterType === 0 ? 'sawtooth' : (monsterType === 1 ? 'triangle' : 'square');
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function switchMonster() {
            monsterType = (monsterType + 1) % 3;
            const names = ["الوحش الفضائي (بلوب)", "الوحش الدبوس (زوزو)", "الوحش الروبوت (بيبو)"];
            statusBar.innerText = `تم استدعاء: ${names[monsterType]}!`;
        }

        function resetGame() {
            particles = [];
            notes = [];
            score = 0;
            combo = 0;
        }

        // توليد نوتة موسيقية جديدة تسقط من الأعلى بشكل دوري
        function spawnNote() {
            if (canvasElement.width > 0) {
                notes.push({
                    x: Math.random() * (canvasElement.width - 60) + 30,
                    y: -20,
                    speed: 2 + Math.random() * 2.5,
                    radius: 16,
                    color: ['#ff007f', '#00ffcc', '#ffee00'][Math.floor(Math.random() * 3)]
                });
            }
        }
        setInterval(spawnNote, 1400);

        function drawMonster(x, y, isPlaying) {
            canvasCtx.save();
            canvasCtx.translate(x, y);

            let baseColor = monsterType === 0 ? '#ff007f' : (monsterType === 1 ? '#00ffcc' : '#ffee00');
            let eyeColor = '#ffffff';

            // جسم الوحش
            canvasCtx.beginPath();
            let radius = 45 + (isPlaying ? Math.sin(Date.now() / 50) * 5 : 0);
            canvasCtx.arc(0, 0, radius, 0, Math.PI * 2);
            canvasCtx.fillStyle = baseColor;
            canvasCtx.shadowBlur = 25;
            canvasCtx.shadowColor = baseColor;
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;

            // العيون
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 8, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 8, 0, Math.PI * 2);
            canvasCtx.fillStyle = eyeColor;
            canvasCtx.fill();

            // بؤبؤ العين
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 3, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 3, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fill();

            // الفم
            canvasCtx.beginPath();
            if (isPlaying) {
                canvasCtx.arc(0, 15, 12, 0, Math.PI * 2);
                canvasCtx.fillStyle = '#000';
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#fff';
                canvasCtx.stroke();
            } else {
                canvasCtx.arc(0, 15, 10, 0, Math.PI);
                canvasCtx.strokeStyle = '#000';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            }

            canvasCtx.restore();
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let monsterX = canvasElement.width / 2;
            let monsterY = canvasElement.height / 2;
            let handActive = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8]; // السبابة
                monsterX = indexFinger.x * canvasElement.width;
                monsterY = indexFinger.y * canvasElement.height;

                handActive = true;
                lastMoveTime = Date.now();
            }

            // --- تحديث ورسم النوتات الهابطة (Game Logic) ---
            for (let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                n.y += n.speed;

                // رسم النوتة
                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                canvasCtx.fillStyle = n.color;
                canvasCtx.shadowBlur = 15;
                canvasCtx.shadowColor = n.color;
                canvasCtx.fill();
                canvasCtx.restore();

                // فحص الاصطدام مع موقع الوحش / الإصبع
                let dist = Math.hypot(monsterX - n.x, (monsterY - 50) - n.y);
                if (dist < 45) {
                    // تم التقاط النوتة بنجاح!
                    score += 10 + (combo * 2);
                    combo++;
                    
                    let freq = 200 + (canvasElement.height - n.y) * 1.5;
                    playNote(freq);

                    // توليد شرارة نيون عند الالتقاط
                    for (let p = 0; p < 6; p++) {
                        particles.push({
                            x: n.x,
                            y: n.y,
                            radius: Math.random() * 6 + 2,
                            color: n.color,
                            alpha: 1,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10
                        });
                    }

                    notes.splice(i, 1);
                } else if (n.y > canvasElement.height + 20) {
                    // إذا سقطت النوتة للأرض تفقد الكومبو
                    combo = 0;
                    notes.splice(i, 1);
                }
            }

            // رسم الوحش (يتبع اليد إذا كانت موجودة، أو يبقى في المنتصف)
            if (handActive) {
                drawMonster(monsterX, monsterY - 50, true);
            } else {
                drawMonster(canvasElement.width / 2, canvasElement.height / 2, false);
            }

            // تحديث ورسم الجزيئات (Particles)
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.05;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    canvasCtx.save();
                    canvasCtx.globalAlpha = p.alpha;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.fill();
                    canvasCtx.restore();
                }
            }

            // عرض النقاط والكومبو على الشاشة
            canvasCtx.font = "bold 18px Arial";
            canvasCtx.fillStyle = "#ffffff";
            canvasCtx.shadowBlur = 8;
            canvasCtx.shadowColor = "#00ffcc";
            canvasCtx.fillText(`النقاط: ${score}`, 25, 35);
            canvasCtx.fillText(`الكومبو: x${combo}`, 25, 65);
            canvasCtx.shadowBlur = 0;

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            alert("خطأ في تشغيل الكاميرا: " + err);
        });
    </script>
</body>
</html>
