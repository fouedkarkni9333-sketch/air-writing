<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الكتابة في الهواء - Air Writing</title>
    <!-- مكتبات MediaPipe للبراوزر -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { margin: 10px; font-size: 18px; }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* عكس الصورة لتكون مرآة */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .clear-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        .clear-btn:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h2>تتبع اليد والكتابة في الهواء عبر المتصفح</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <button class="clear-btn" id="clearBtn">مسح الشاشة</button>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');

        // مصفوفة لحفظ مسار الخطوط المرسومة (تحتوي على خطوط وكل خط عبارة عن مجموعة نقاط)
        let lines = [];
        let currentLine = [];

        // زر المسح لحذف جميع الخطوط المرسومة
        clearBtn.addEventListener('click', () => {
            lines = [];
            currentLine = [];
        });

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // رسم صورة الكاميرا في الخلفية
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let fingerDetected = false;

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    // إحداثيات الإصبع السبابة (Landmark 8)
                    const indexFinger = landmarks[8];
                    const x = indexFinger.x * canvasElement.width;
                    const y = indexFinger.y * canvasElement.height;

                    fingerDetected = true;
                    currentLine.push({x: x, y: y});

                    // رسم دائرة خضراء مكان طرف الإصبع
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = '#00FF00';
                    canvasCtx.fill();
                }
            }

            // إذا لم يتم رصد الإصبع، نقوم بإنهاء الخط الحالي وبدء خط جديد عند الرفع القادم
            if (!fingerDetected && currentLine.length > 0) {
                lines.push(currentLine);
                currentLine = [];
            }

            // دمج الخط الحالي مع الخطوط السابقة لكي يتم رسمها مستمرة
            const allLines = [...lines];
            if (currentLine.length > 0) {
                allLines.push(currentLine);
            }

            // رسم جميع الخطوط على الـ Canvas
            allLines.forEach(line => {
                if (line.length > 1) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(line[0].x, line[0].y);
                    for (let i = 1; i < line.length; i++) {
                        canvasCtx.lineTo(line[i].x, line[i].y);
                    }
                    canvasCtx.strokeStyle = '#00FF00';
                    canvasCtx.lineWidth = 5;
                    canvasCtx.lineCap = 'round';
                    canvasCtx.lineJoin = 'round';
                    canvasCtx.stroke();
                }
            });

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start().catch(err => {
            alert("خطأ في تشغيل الكاميرا: " + err);
        });
    </script>
</body>
</html>
