<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Maestro - حديقة الوحوش العازفة (الإصدار الاحترافي)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        h2 { margin: 8px; font-size: 18px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.7); }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #000;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            max-width: 400px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-cam { background-color: #00ffcc; color: #000; }
        .btn-party { background-color: #ff007f; color: white; }
        .btn-reset { background-color: #3f3f46; color: white; }
        .status-bar {
            margin-top: 8px;
            font-size: 14px;
            color: #ff007f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>👾 حديقة الوحوش العازفة - التحدي الحماسي</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-bar" id="statusBar">اضغط على "تشغيل الكاميرا" للبدء!</div>

    <div class="controls">
        <button class="btn-cam" onclick="startCamera()">تشغيل الكاميرا 📷</button>
        <button class="btn-party" onclick="switchMonster()">تغيير الوحش 🎭</button>
        <button class="btn-reset" onclick="resetGame()">إعادة اللعبة</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        let particles = [];
        let items = []; 
        let score = 0;
        let combo = 0;
        let lives = 3;
        let isGameOver = false;
        let monsterType = 0; 
        let lastMoveTime = Date.now();
        let screenShake = 0;
        let cameraInstance = null;
        let latestResults = null;
        let isRunning = false;

        // إدارة الصوت بطريقة آمنة
        let audioCtx = null;
        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.error("Audio Context error:", e);
            }
        }
        
        function playNote(freq, typeOverride, duration = 0.15, vol = 0.08) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = typeOverride || (monsterType === 0 ? 'sawtooth' : (monsterType === 1 ? 'triangle' : 'square'));
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // تجاوز الأخطاء الصامتة
            }
        }

        function switchMonster() {
            monsterType = (monsterType + 1) % 3;
            const names = ["الوحش الفضائي (بلوب)", "الوحش الدبوس (زوزو)", "الوحش الروبوت (بيبو)"];
            statusBar.innerText = `تم استدعاء: ${names[monsterType]}!`;
        }

        function resetGame() {
            particles = [];
            items = [];
            score = 0;
            combo = 0;
            lives = 3;
            isGameOver = false;
            statusBar.innerText = "بدأت اللعبة! حرك يدك الآن.";
        }

        // توليد العناصر الهابطة بمعدل مستقر
        setInterval(() => {
            if (isRunning && canvasElement.width > 0 && !isGameOver) {
                let isBomb = Math.random() < 0.25; 
                let speedMultiplier = 1 + (score / 200); 
                items.push({
                    x: Math.random() * (canvasElement.width - 60) + 30,
                    y: -30,
                    speed: (2.5 + Math.random() * 2) * Math.min(speedMultiplier, 2.2),
                    radius: isBomb ? 20 : 16,
                    isBomb: isBomb,
                    color: isBomb ? '#ff2222' : ['#ff007f', '#00ffcc', '#ffee00', '#ff5500'][Math.floor(Math.random() * 4)]
                });
            }
        }, 1100);

        function drawMonster(x, y, isPlaying) {
            canvasCtx.save();
            canvasCtx.translate(x, y);

            let baseColor = monsterType === 0 ? '#ff007f' : (monsterType === 1 ? '#00ffcc' : '#ffee00');
            if (combo >= 10) {
                baseColor = `hsl(${Date.now() / 4 % 360}, 100%, 50%)`;
            }
            let eyeColor = '#ffffff';

            canvasCtx.beginPath();
            let radius = 45 + (isPlaying ? Math.sin(Date.now() / 30) * 6 : 0);
            canvasCtx.arc(0, 0, radius, 0, Math.PI * 2);
            canvasCtx.fillStyle = baseColor;
            canvasCtx.shadowBlur = combo >= 10 ? 35 : 20;
            canvasCtx.shadowColor = baseColor;
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;

            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 8, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 8, 0, Math.PI * 2);
            canvasCtx.fillStyle = eyeColor;
            canvasCtx.fill();

            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 3, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 3, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fill();

            canvasCtx.beginPath();
            if (isPlaying) {
                canvasCtx.arc(0, 15, 14, 0, Math.PI * 2); 
                canvasCtx.fillStyle = '#000';
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#fff';
                canvasCtx.stroke();
            } else {
                canvasCtx.arc(0, 15, 10, 0, Math.PI); 
                canvasCtx.strokeStyle = '#000';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            }

            canvasCtx.restore();
        }

        // معالجة النتائج الواردة من نموذج تتبع اليدين
        function onResults(results) {
            latestResults = results;
        }

        // حلقة الرسم والتحديث الأساسية المعتمدة على محرك المتصفح للأداء العالي
        function gameLoop() {
            if (isRunning) {
                updateAndRender(latestResults);
            }
            requestAnimationFrame(gameLoop);
        }

        function updateAndRender(results) {
            if (videoElement.videoWidth > 0 && canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            if (canvasElement.width === 0 || canvasElement.height === 0) return;

            canvasCtx.save();

            if (screenShake > 0) {
                let shakeX = (Math.random() - 0.5) * screenShake;
                let shakeY = (Math.random() - 0.5) * screenShake;
                canvasCtx.translate(shakeX, shakeY);
                screenShake *= 0.85;
            }

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results && results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (combo >= 10) {
                canvasCtx.fillStyle = `hsla(${Date.now() / 3 % 360}, 100%, 50%, 0.15)`;
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            }

            if (isGameOver) {
                canvasCtx.fillStyle = "rgba(0, 0, 0, 0.9)";
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.fillStyle = "#ff007f";
                canvasCtx.font = "bold 32px Arial";
                canvasCtx.textAlign = "center";
                canvasCtx.fillText("انتهت اللعبة! 💥", canvasElement.width / 2, canvasElement.height / 2 - 20);
                canvasCtx.fillStyle = "#ffffff";
                canvasCtx.font = "bold 18px Arial";
                canvasCtx.fillText(`النتيجة النهائية: ${score}`, canvasElement.width / 2, canvasElement.height / 2 + 25);
                canvasCtx.restore();
                return;
            }

            let monsterX = canvasElement.width / 2;
            let monsterY = canvasElement.height / 2;
            let handActive = false;

            if (results && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8]; 
                monsterX = (1 - indexFinger.x) * canvasElement.width;
                monsterY = indexFinger.y * canvasElement.height;

                handActive = true;
                lastMoveTime = Date.now();
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);

                if (item.isBomb) {
                    canvasCtx.fillStyle = "#111";
                    canvasCtx.shadowBlur = 12;
                    canvasCtx.shadowColor = "#ff0000";
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = "#ff0000";
                    canvasCtx.stroke();
                    canvasCtx.fillStyle = "#ff5555";
                    canvasCtx.font = "bold 14px Arial";
                    canvasCtx.fillText("💣", item.x - 8, item.y + 5);
                } else {
                    canvasCtx.fillStyle = item.color;
                    canvasCtx.shadowBlur = combo >= 10 ? 25 : 15;
                    canvasCtx.shadowColor = item.color;
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#fff';
                    canvasCtx.stroke();
                }
                canvasCtx.restore();

                let dist = Math.hypot(monsterX - item.x, (monsterY - 40) - item.y);
                if (dist < 45) {
                    if (item.isBomb) {
                        lives--;
                        combo = 0;
                        screenShake = 15; 
                        playNote(60, 'sawtooth', 0.25, 0.15); 
                        statusBar.innerText = "⚠️ احذر! انفجرت قنبلة!";
                        if (lives <= 0) isGameOver = true;
                    } else {
                        let multiplier = combo >= 10 ? 2 : 1;
                        score += (15 + (combo * 5)) * multiplier;
                        combo++;

                        let freq = 180 + (combo * 25);
                        playNote(freq, undefined, 0.1, 0.08);

                        for (let p = 0; p < 8; p++) {
                            particles.push({
                                x: item.x,
                                y: item.y,
                                radius: Math.random() * 6 + 2,
                                color: item.color,
                                alpha: 1,
                                vx: (Math.random() - 0.5) * 12,
                                vy: (Math.random() - 0.5) * 12
                            });
                        }
                    }
                    items.splice(i, 1);
                } else if (item.y > canvasElement.height + 25) {
                    if (!item.isBomb && combo > 0) combo = 0;
                    items.splice(i, 1);
                }
            }

            if (handActive) {
                drawMonster(monsterX, monsterY - 40, true);
            } else {
                if (Date.now() - lastMoveTime > 2000) {
                    drawMonster(canvasElement.width / 2, canvasElement.height / 2, false);
                } else {
                    drawMonster(monsterX, monsterY - 40, true);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.05;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    canvasCtx.save();
                    canvasCtx.globalAlpha = p.alpha;
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = p.color;
                    canvasCtx.fill();
                    canvasCtx.restore();
                }
            }

            canvasCtx.save();
            canvasCtx.font = "bold 18px Arial";
            canvasCtx.shadowBlur = 6;
            canvasCtx.shadowColor = "#000";
            
            canvasCtx.fillStyle = "#00ffcc";
            canvasCtx.fillText(`النقاط: ${score}`, 25, 35);
            
            if (combo >= 10) {
                canvasCtx.fillStyle = "#ffee00";
                canvasCtx.fillText(`🔥 FEVER MODE x${combo} 🔥`, 25, 65);
            } else {
                canvasCtx.fillStyle = "#ff007f";
                canvasCtx.fillText(`الكومبو: x${combo}`, 25, 65);
            }

            let heartsText = "❤️ ".repeat(Math.max(0, lives));
            canvasCtx.fillStyle = "#ff3333";
            canvasCtx.fillText(`الأرواح: ${heartsText}`, 25, 95);

            canvasCtx.restore();
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        function startCamera() {
            initAudio();
            statusBar.innerText = "جاري تشغيل الكاميرا...";

            if (cameraInstance) {
                return;
            }

            try {
                cameraInstance = new Camera(videoElement, {
                    onFrame: async () => {
                        if (videoElement.readyState >= 2) {
                            await hands.send({ image: videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });

                cameraInstance.start().then(() => {
                    isRunning = true;
                    statusBar.innerText = "الكاميرا تعمل بنجاح! استمتع باللعبة.";
                }).catch(err => {
                    console.error(err);
                    alert("خطأ في تشغيل الكاميرا: يرجى السماح بالصلاحية أو التأكد من عدم استخدامها في تطبيق آخر.");
                    statusBar.innerText = "فشل تشغيل الكاميرا!";
                    cameraInstance = null;
                });
            } catch (e) {
                console.error(e);
                statusBar.innerText = "حدث خطأ أثناء تهيئة الكاميرا.";
                cameraInstance = null;
            }
        }

        // بدء حلقة التشغيل الرئيسية للرسومات
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
