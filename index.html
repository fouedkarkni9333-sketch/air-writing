<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gravity - مجرة الجاذبية الكونية</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #030308;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        h2 { margin: 6px; font-size: 17px; color: #00ffcc; text-shadow: 0 0 12px rgba(0,255,204,0.7); }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            background: #000;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .status-bar {
            margin-top: 8px;
            font-size: 13px;
            color: #ff007f;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255,0,127,0.5);
        }
    </style>
</head>
<body>

    <h2>🌌 Cosmic Gravity - مجرة الجاذبية</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-bar" id="statusBar">حرك إصبعك لتحريك النجوم | اقبض يدك لعمل انفجار كوني</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        // إنشاء نظام النجوم الكونية (Particle System)
        let stars = [];
        const numStars = 250;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: Math.random() * 2.5 + 1,
                color: `hsl(${Math.random() * 60 + 160}, 100%, 70%)` // درجات الفيروزي والأزرق السماوي
            });
        }

        let handX = -100;
        let handY = -100;
        let isFist = false;

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // رسم خلفية الكاميرا بشفافية خفيفة لدمجها مع الفضاء
            canvasCtx.globalAlpha = 0.25;
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.globalAlpha = 1.0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8]; // السبابة
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];

                handX = indexFinger.x * canvasElement.width;
                handY = indexFinger.y * canvasElement.height;

                // التحقق مما إذا كانت اليد مقبوضة (Fist) عبر تقارب الأصابع من المعصم
                let distToWrist = Math.hypot(indexFinger.x - wrist.x, indexFinger.y - wrist.y);
                isFist = distToWrist < 0.25;

                if (isFist) {
                    statusBar.innerText = "💥 انفجار كوني نشط! (Supernova)";
                } else {
                    statusBar.innerText = "✨ إصبعك يتحكم بجاذبية المجرة";
                }

                // رسم دائرة تو
