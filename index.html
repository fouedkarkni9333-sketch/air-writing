<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Maestro - حديقة الوحوش العازفة (الإصدار الكامل)</title>
    <!-- مكتبات MediaPipe للبراوزر -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        h2 { margin: 8px; font-size: 18px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.7); }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #000;
            border: 2px solid #00ffcc;
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* مرآة */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            max-width: 400px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-party { background-color: #ff007f; color: white; }
        .btn-reset { background-color: #3f3f46; color: white; }
        .status-bar {
            margin-top: 8px;
            font-size: 14px;
            color: #ff007f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>👾 حديقة الوحوش العازفة - التحدي الأقصى</h2>
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="status-bar" id="statusBar">التقط النوتات وتجنب القنابل السوداء!</div>

    <div class="controls">
        <button class="btn-party" onclick="switchMonster()">تغيير نوع الوحش 🎭</button>
        <button class="btn-reset" onclick="resetGame()">إعادة اللعبة</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        let particles = [];
        let items = []; // ستشمل النوتات والقنابل
        let score = 0;
        let combo = 0;
        let lives = 3;
        let monsterType = 0; 
        let isGameOver = false;

        // نظام الأصوات عبر Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, type = 'sine', duration = 0.2, volume = 0.1) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function switchMonster() {
            monsterType = (monsterType + 1) % 3;
            const names = ["الوحش الفضائي (بلوب)", "الوحش الدبوس (زوزو)", "الوحش الروبوت (بيبو)"];
            statusBar.innerText = `تم استدعاء: ${names[monsterType]}!`;
        }

        function resetGame() {
            particles = [];
            items = [];
            score = 0;
            combo = 0;
            lives = 3;
            isGameOver = false;
            statusBar.innerText = "لعبة جديدة! حرك يدك الآن.";
        }

        // توليد عناصر هابطة (نوتات موسيقية أو قنابل)
        setInterval(() => {
            if (canvasElement.width > 0 && !isGameOver) {
                let isBomb = Math.random() < 0.25; // نسبة ظهور القنابل 25%
                items.push({
                    x: Math.random() * (canvasElement.width - 80) + 40,
                    y: -30,
                    speed: 2.5 + Math.random() * 2.5,
                    radius: isBomb ? 22 : 18,
                    isBomb: isBomb,
                    color: isBomb ? '#111111' : ['#ff007f', '#00ffcc', '#ffee00', '#ff5500'][Math.floor(Math.random() * 4)]
                });
            }
        }, 1100);

        function drawMonster(x, y, isPlaying) {
            canvasCtx.save();
            canvasCtx.translate(x, y);

            // إذا كان في وضع Fever Mode، يتغير لون الوحش بسرعة مع نبضات الشاشة
            let baseColor = monsterType === 0 ? '#ff007f' : (monsterType === 1 ? '#00ffcc' : '#ffee00');
            if (combo >= 10) {
                baseColor = `hsl(${Date.now() / 5 % 360}, 100%, 50%)`;
            }

            // جسم الوحش
            canvasCtx.beginPath();
            let radius = 45 + (isPlaying ? Math.sin(Date.now() / 40) * 6 : 0);
            canvasCtx.arc(0, 0, radius, 0, Math.PI * 2);
            canvasCtx.fillStyle = baseColor;
            canvasCtx.shadowBlur = combo >= 10 ? 35 : 20;
            canvasCtx.shadowColor = baseColor;
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;

            // العيون
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 8, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 8, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#fff';
            canvasCtx.fill();

            // بؤبؤ العين
            canvasCtx.beginPath();
            canvasCtx.arc(-15, -10, 3, 0, Math.PI * 2);
            canvasCtx.arc(15, -10, 3, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fill();

            // الفم
            canvasCtx.beginPath();
            if (isPlaying) {
                canvasCtx.arc(0, 15, 14, 0, Math.PI * 2);
                canvasCtx.fillStyle = '#000';
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#fff';
                canvasCtx.stroke();
            } else {
                canvasCtx.arc(0, 15, 10, 0, Math.PI);
                canvasCtx.strokeStyle = '#000';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            }

            canvasCtx.restore();
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            // 1. رسم الكاميرا وتأثير Fever Mode على الخلفية إذا وصل الكومبو لـ 10
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (combo >= 10) {
                canvasCtx.save();
                canvasCtx.fillStyle = `hsla(${Date.now() / 4 % 360}, 100%, 50%, 0.12)`;
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.restore();
            }

            if (isGameOver) {
                canvasCtx.save();
                canvasCtx.fillStyle = "rgba(0, 0, 0, 0.85)";
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.fillStyle = "#ff007f";
                canvasCtx.font = "bold 32px Arial";
                canvasCtx.textAlign = "center";
                canvasCtx.fillText("انتهت اللعبة! 💀", canvasElement.width / 2, canvasElement.height / 2 - 20);
                canvasCtx.fillStyle = "#ffffff";
                canvasCtx.font = "bold 20px Arial";
                canvasCtx.fillText(`النتيجة النهائية: ${score}`, canvasElement.width / 2, canvasElement.height / 2 + 25);
                canvasCtx.restore();
                return;
            }

            let monsterX = canvasElement.width / 2;
            let monsterY = canvasElement.height / 2;
            let handActive = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexFinger = landmarks[8];
                monsterX = (1 - indexFinger.x) * canvasElement.width;
                monsterY = indexFinger.y * canvasElement.height;
                handActive = true;
            }

            // 2. تحديث ورسم العناصر الساقطة (نوتات وقنابل)
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                canvasCtx.save();
                canvasCtx.beginPath();
                canvasCtx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                
                if (item.isBomb) {
                    // رسم القنبلة بلون أسود مع فتيل محترق
                    canvasCtx.fillStyle = "#1a1a1a";
                    canvasCtx.shadowBlur = 12;
                    canvasCtx.shadowColor = "#ff0000";
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = "#ff3333";
                    canvasCtx.stroke();
                    // رسم علامة X أو فتيل
                    canvasCtx.fillStyle = "#ff0000";
                    canvasCtx.font = "bold 14px Arial";
                    canvasCtx.fillText("💣", item.x - 10, item.y + 5);
                } else {
                    // رسم النوتة الموسيقية
                    canvasCtx.fillStyle = item.color;
                    canvasCtx.shadowBlur = combo >= 10 ? 25 : 15;
                    canvasCtx.shadowColor = item.color;
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#ffffff';
                    canvasCtx.stroke();
                }
                canvasCtx.restore();

                // فحص الاصطدام مع الوحش
                let dist = Math.hypot(monsterX - item.x, (monsterY - 40) - item.y);
                if (dist < 50) {
                    if (item.isBomb) {
                        // اصطدام بقنبلة! خسر محاولة
                        lives--;
                        combo = 0;
                        playSound(80, 'sawtooth', 0.3, 0.2); // صوت نشاز حاد
                        statusBar.innerText = "احتذِير! لقد اصطدمت بقن
